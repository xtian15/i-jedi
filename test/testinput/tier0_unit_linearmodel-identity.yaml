geometry:
  geometry_type: atlas
  nlevels: 2
  function space: StructuredColumns
  grid:
    type: regular_gaussian
    N: 2

analysis variables: [air_temperature]

background error:
  covariance model: ijediError

model:
  name: I-JEDI persistence
  time step: PT15M
  model variables: [air_temperature]

model aux control: {}
model aux error: {}

initial condition:
  date: 2026-01-01T00:00:00Z
  state variables: [air_temperature]
  analytic init:
    method: zero

linear model:
  name: I-JEDI identity
  time step: PT15M

linear model test:
  forecast length: PT1H
  iterations TL: 2
  tolerance AD: 1.0e-14
  tolerance TL: 1.0e-12

time window:
  begin: 2026-01-01T00:00:00Z
  end: 2026-01-01T01:00:00Z
