name: Complete MPAS interface qualification
on: [pull_request]

permissions:
  contents: read

jobs:
  run_all_tests:
    runs-on: ubuntu-24.04-arm
    # The qualified graph is native aarch64. Publishing its immutable consumer
    # environment/inputs is a separate prerequisite; no older image fallback.
    container: ${{ vars.IJEDI_MPAS_QUALIFICATION_IMAGE }}
    env:
      IJEDI_MPAS_QUALIFICATION_IMAGE: ${{ vars.IJEDI_MPAS_QUALIFICATION_IMAGE }}
      IJEDI_MPAS_RELEASE_INPUTS_FILE: ${{ vars.IJEDI_MPAS_RELEASE_INPUTS_FILE }}
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      OMPI_ALLOW_RUN_AS_ROOT: '1'
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: '1'
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        path: i-jedi
        submodules: recursive
    - name: Require the immutable native qualification environment
      shell: bash
      run: |
        unset BASH_ENV PYTHONPATH LD_PRELOAD
        if [[ ! "$IJEDI_MPAS_QUALIFICATION_IMAGE" =~ ^[^@]+@sha256:[0-9a-f]{64}$ ]]; then
          echo 'Missing approved digest-pinned MPAS qualification image.' >&2
          exit 1
        fi
        test "$(uname -m)" = aarch64
        test -n "$IJEDI_MPAS_RELEASE_INPUTS_FILE"
        test -f "$IJEDI_MPAS_RELEASE_INPUTS_FILE"
        command -v ecbuild cmake ctest python3
        # The one locked runtime serves stock embedding and data scripts.
        python3 -c 'import bufr, netCDF4, pycodestyle, socket; socket.gethostbyname(socket.gethostname())'
    - name: Configure the exact graph once
      shell: bash
      run: |
        unset BASH_ENV PYTHONPATH LD_PRELOAD
        test ! -e "$GITHUB_WORKSPACE/Build"
        mkdir "$GITHUB_WORKSPACE/Build"
        cd "$GITHUB_WORKSPACE/Build"
        ecbuild -C "$IJEDI_MPAS_RELEASE_INPUTS_FILE" -DIJEDI_MPAS_TEST_SUITE=analysis \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DMPI_ARGS="--map-by :OVERSUBSCRIBE" \
          "$GITHUB_WORKSPACE/i-jedi/bundle"
    - name: Build and qualify fresh I-JEDI products
      shell: bash
      run: |
        unset BASH_ENV PYTHONPATH LD_PRELOAD
        python3 "$GITHUB_WORKSPACE/i-jedi/tools/qualification/run_mpas_tests.py" \
          --source "$GITHUB_WORKSPACE/i-jedi" --build "$GITHUB_WORKSPACE/Build/ijedi" \
          --manifest "$GITHUB_WORKSPACE/i-jedi/docs/MPAS_REQUIRED_TESTS.json" \
          --suite analysis --output "$GITHUB_WORKSPACE/mpas-qualification" \
          --lock-file "$GITHUB_WORKSPACE/mpas-qualification.lock" \
          --build-jobs 2 --test-jobs 2
    - name: Build all remaining dependency targets and run their full gate
      shell: bash
      run: |
        unset BASH_ENV PYTHONPATH LD_PRELOAD
        cmake --build "$GITHUB_WORKSPACE/Build" -j2
        ctest --test-dir "$GITHUB_WORKSPACE/Build" --no-tests=error \
          --show-only=json-v1 > "$GITHUB_WORKSPACE/dependency-inventory.json"
        ctest --test-dir "$GITHUB_WORKSPACE/Build" -j1 --no-tests=error \
          -E '^ijedi_' --output-on-failure \
          --output-junit "$GITHUB_WORKSPACE/dependency-results.xml"
        python3 "$GITHUB_WORKSPACE/i-jedi/tools/qualification/check_dependency_results.py" \
          --inventory "$GITHUB_WORKSPACE/dependency-inventory.json" \
          --results "$GITHUB_WORKSPACE/dependency-results.xml"
    - name: Authenticate final I-JEDI artifacts
      shell: bash
      run: |
        unset BASH_ENV PYTHONPATH LD_PRELOAD
        python3 "$GITHUB_WORKSPACE/i-jedi/tools/qualification/run_mpas_tests.py" \
          --source "$GITHUB_WORKSPACE/i-jedi" --build "$GITHUB_WORKSPACE/Build/ijedi" \
          --verify-receipt "$GITHUB_WORKSPACE/mpas-qualification/qualified.json"
    - name: Retain qualification evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: mpas-qualification
        path: |
          mpas-qualification/
          dependency-inventory.json
          dependency-results.xml
        if-no-files-found: error
